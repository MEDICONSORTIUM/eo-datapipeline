name: EOHA NCD Data Pipeline

on:
  # Monthly scheduling stays disabled until the live three-ward smoke test passes.
  # Proposed future schedule: 17 2 20 * * (04:17 SAST on the 20th).
  workflow_dispatch:
    inputs:
      month:
        description: "Optional month to process (YYYY-MM, January 2026 or later)"
        required: false
        type: string
      province:
        description: "Optional South African province"
        required: false
        type: string
      smoke_test:
        description: "Process only three wards"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: eoha-ncd-data-pipeline
  cancel-in-progress: false

jobs:
  checks:
    name: Local checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run tests
        run: python -m unittest discover -s tests -v

  run-ncd:
    name: Run NCD pipeline
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ncd-smoke-test
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run NCD collection and load
        shell: bash
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: "5432"
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          RUN_MONTH: ${{ inputs.month }}
          RUN_PROVINCE: ${{ inputs.province }}
          RUN_SMOKE_TEST: ${{ inputs.smoke_test }}
        run: |
          args=()
          if [[ -n "$RUN_MONTH" ]]; then args+=(--month "$RUN_MONTH"); fi
          if [[ -n "$RUN_PROVINCE" ]]; then args+=(--province "$RUN_PROVINCE"); fi
          if [[ "$RUN_SMOKE_TEST" == "true" ]]; then args+=(--smoke-test); fi
          python ncd_pipeline.py "${args[@]}"

