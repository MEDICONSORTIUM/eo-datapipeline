name: EOHA Data Pipeline

on:
  schedule:
    # Run after the previous month's satellite data has had time to arrive.
    - cron: "0 2 15 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Optional month to process (YYYY-MM)"
        required: false
        type: string
      province:
        description: "Optional province to process"
        required: false
        type: string
      smoke_test:
        description: "Run a small three-region test"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: eoha-data-pipeline
  cancel-in-progress: false

jobs:
  run-etl:
    name: Test and run the pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run project checks
        run: python -m unittest discover -s tests -v

      - name: Run the data pipeline
        shell: bash
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: "5432"
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          RUN_MONTH: ${{ inputs.month }}
          RUN_PROVINCE: ${{ inputs.province }}
          RUN_SMOKE_TEST: ${{ inputs.smoke_test }}
        run: |
          args=()

          if [[ -n "$RUN_MONTH" ]]; then
            args+=(--month "$RUN_MONTH")
          fi

          if [[ -n "$RUN_PROVINCE" ]]; then
            args+=(--province "$RUN_PROVINCE")
          fi

          if [[ "$RUN_SMOKE_TEST" == "true" ]]; then
            args+=(--smoke-test)
          fi

          python etl_pipeline.py "${args[@]}"
